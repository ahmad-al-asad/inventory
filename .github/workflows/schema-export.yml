name: Export Room schemas (temporary)

on:
  push:
    branches: [test-1.3.0]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (also writes the database schema)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Commit schemas to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/schemas
          git commit -m "Add Room database schema v3" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
