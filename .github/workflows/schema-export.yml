name: Export Room schemas (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Schema of this version
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileReleaseJavaWithJavac
      - name: Schema of version 1.1.0
        run: |
          git fetch --depth 1 origin fead19a79d7345163a7b6c0a9c6bd4f4478d383a || git fetch --unshallow origin
          git worktree add ../old fead19a79d7345163a7b6c0a9c6bd4f4478d383a
          cd ../old && chmod +x gradlew && ./gradlew --no-daemon :app:compileReleaseJavaWithJavac
          cp -r app/schemas/* "$GITHUB_WORKSPACE/app/schemas/"
      - name: Commit schemas to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/schemas
          git commit -m "Add Room database schemas" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
