name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key from secrets
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Signing secrets are not set. Building with a debug key; no release will be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "STOCKKEEP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "STOCKKEEP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          mv app/build/outputs/apk/release/app-release.apk "StockKeep-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: StockKeep-apk
          path: StockKeep-*.apk

      # The database layout Room generated, for checking migrations between versions.
      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/

      # Publishes a public download at github.com/<you>/inventory/releases for every new versionName.
      - name: Publish GitHub Release
        if: steps.key.outputs.signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionName/versionCode in app/build.gradle to publish a new one."
          else
            gh release create "$TAG" "StockKeep-$VERSION.apk" \
              --title "StockKeep $VERSION" \
              --notes "Download **StockKeep-$VERSION.apk** below and open it on your Android phone (Android 8.0 or newer)."
          fi
