plugins {
    id 'com.android.application'
}

// The signing key never changes. Every build (debug or release, on any computer)
// is signed with it, so a new APK always installs over the old one and keeps your data.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.stockkeep.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.stockkeep.app"   // never change this, or updates won't install over the old app
        minSdk 26
        targetSdk 34
        versionCode 1                       // increase by 1 for every new version you install
        versionName "1.0.0"

        javaCompileOptions {
            annotationProcessorOptions {
                // Room writes the database layout here so future versions can migrate safely
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        stockkeep {
            storeFile rootProject.file(keystoreProps.getProperty('storeFile', 'keystore/stockkeep.jks'))
            storePassword keystoreProps.getProperty('storePassword')
            keyAlias keystoreProps.getProperty('keyAlias')
            keyPassword keystoreProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stockkeep
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stockkeep
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.work:work-runtime:2.9.1'

    def room = '2.6.1'
    implementation "androidx.room:room-runtime:$room"
    annotationProcessor "androidx.room:room-compiler:$room"

    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
