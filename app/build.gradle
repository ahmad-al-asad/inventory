plugins {
    id 'com.android.application'
}

// Signing key. It is NEVER stored in git.
//  - On your computer: put release.jks and signing.properties in the project folder (both are gitignored).
//  - On GitHub: the build reads the KEYSTORE_BASE64 / KEYSTORE_PASSWORD repository secrets.
//  - Anyone else building from source: no key found, so a normal debug key is used.
// Using the same key every time is what lets new versions install over the old app and keep its data.
def signingProps = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def keyStorePath = System.getenv('STOCKKEEP_KEYSTORE') ?: signingProps.getProperty('storeFile')
def keyStorePassword = System.getenv('STOCKKEEP_KEYSTORE_PASSWORD') ?: signingProps.getProperty('storePassword')
def keyAliasName = System.getenv('STOCKKEEP_KEY_ALIAS') ?: signingProps.getProperty('keyAlias', 'stockkeep')
def keyPasswordValue = System.getenv('STOCKKEEP_KEY_PASSWORD') ?: signingProps.getProperty('keyPassword', keyStorePassword)
def hasReleaseKey = keyStorePath != null && keyStorePassword != null && rootProject.file(keyStorePath).exists()

android {
    namespace 'com.stockkeep.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.stockkeep.app"   // never change this, or updates won't install over the old app
        minSdk 26
        targetSdk 34
        versionCode 3                       // increase by 1 for every new version you install
        versionName "1.2.0"

        javaCompileOptions {
            annotationProcessorOptions {
                // Room writes the database layout here so future versions can migrate safely
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            stockkeep {
                storeFile rootProject.file(keyStorePath)
                storePassword keyStorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            if (hasReleaseKey) signingConfig signingConfigs.stockkeep
        }
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.stockkeep : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.biometric:biometric:1.1.0'

    def room = '2.6.1'
    implementation "androidx.room:room-runtime:$room"
    annotationProcessor "androidx.room:room-compiler:$room"

    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
